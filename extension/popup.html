<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>웹죽 데스크</title>
  </head>
  <body>
    <header>
      <span>◈</span>
      <div>
        <h1>웹죽 데스크</h1>
        <p>신앙과 마법, 한눈에.</p>
      </div>
    </header>
    <label>확장 사용<input id="enabled" type="checkbox" /></label>
    <label>집중 화면<input id="focus" type="checkbox" /></label>
    <label>패널 펼치기<input id="expanded" type="checkbox" /></label>
    <p class="hint">
      신앙 <kbd>Alt G</kbd> · 마법 <kbd>Alt M</kbd><br />투척물
      <kbd>Alt T</kbd> · 발동 <kbd>Alt E</kbd><br />빠른 슬롯
      <kbd>Alt 1–6</kbd><br />기존 미니맵 아래에
      타일 패널이 표시됩니다.<br />세부 설정은 게임 패널의 ⚙에서 변경하세요.
    </p>
    <a href="https://crawl.nemelex.cards/#lobby" target="_blank" rel="noopener"
      >네멜렉스 웹죽 열기 ↗</a
    >
    <p id="status" role="status"></p>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
